name: Build StreamVault APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Validate Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "WARNING: gradle-wrapper.jar not found. Downloading..."
            mkdir -p gradle/wrapper
            curl -fsSL https://services.gradle.org/distributions/gradle-8.4-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
              echo "ERROR: Failed to download gradle-wrapper.jar"
              exit 1
            fi
            echo "gradle-wrapper.jar downloaded successfully"
          else
            echo "gradle-wrapper.jar found"
          fi
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: Update Gradle Properties for CI
        run: |
          echo "" >> gradle.properties
          echo "# CI Build Settings" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G -XX:+UseG1GC -XX:MaxGCPauseMillis=250" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties
          cat gradle.properties

      - name: Download Dependencies
        run: |
          ./gradlew --version
          ./gradlew dependencies --dry-run

      - name: Lint Check
        run: ./gradlew lint --stacktrace || echo "Lint warnings found but continuing..."
        continue-on-error: true

      - name: Build Debug APK
        run: |
          echo "Building Debug APK..."
          ./gradlew assembleDebug \
            --build-cache \
            --stacktrace \
            --info

      - name: Build Release APK
        run: |
          echo "Building Release APK..."
          ./gradlew assembleRelease \
            --build-cache \
            --stacktrace \
            --info

      - name: Verify APK Files
        run: |
          echo "Debug APK:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk || echo "Debug APK not found"
          echo ""
          echo "Release APK:"
          ls -lh app/build/outputs/apk/release/app-release.apk || echo "Release APK not found"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ github.run_number }}
          release_name: StreamVault Release v${{ github.run_number }}
          body: |
            **StreamVault Android Application**
            
            Build Number: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            
            📱 Download and install the APK on your Android device:
            - **Debug APK**: For testing and development
            - **Release APK**: For production use
            
            Installation: Enable "Unknown Sources" in settings, then install the APK.
          draft: false
          prerelease: false
        continue-on-error: true

      - name: Upload Debug APK to Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./app/build/outputs/apk/debug/app-debug.apk
          asset_name: StreamVault-debug-v${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive
        continue-on-error: true

      - name: Upload Release APK to Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./app/build/outputs/apk/release/app-release.apk
          asset_name: StreamVault-release-v${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive
        continue-on-error: true

      - name: Build Report
        if: always()
        run: |
          echo "========================================"
          echo "BUILD SUMMARY"
          echo "========================================"
          echo "Status: ${{ job.status }}"
          echo "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "========================================"
